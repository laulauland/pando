name: Release
on:
  push:
    tags: ["v*"]
  # Fallback when a tag push event is not delivered by the credential provider.
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: 1.97.0

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bottle_tag: arm64_sequoia
            runtime: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bottle_tag: x86_64_linux
            runtime: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify release tag matches Cargo version
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test "${GITHUB_REF_NAME}" = "v${version}"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --target "${{ matrix.target }}"
          rustup default "${RUST_TOOLCHAIN}"
      - name: Install BoxLite build prerequisites
        if: matrix.runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Verify the pinned BoxLite runtime archive
        if: matrix.runtime
        run: scripts/prepare-boxlite-runtime "${RUNNER_TEMP}/boxlite-runtime.tar.gz"
      - name: Build release binaries
        env:
          BOXLITE_RUNTIME_URL: file://${{ runner.temp }}/boxlite-runtime.tar.gz
        run: |
          features=()
          if [[ "${{ matrix.runtime }}" == "true" ]]; then
            features=(--features microvm-boxlite)
          fi
          cargo build --locked --release --target "${{ matrix.target }}" "${features[@]}"
      - name: Smoke-test release mode
        run: scripts/test-release-artifact "target/${{ matrix.target }}/release/pando" "${{ matrix.runtime }}"
      - name: Package bottle
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p "pando/${VERSION}/bin"
          cp "target/${{ matrix.target }}/release/pando" "pando/${VERSION}/bin/"
          cp "target/${{ matrix.target }}/release/pd" "pando/${VERSION}/bin/"
          cp LICENSE "pando/${VERSION}/"
          if [[ "${{ matrix.runtime }}" == "true" ]]; then
            cp THIRD_PARTY_NOTICES.md "pando/${VERSION}/"
          fi
          tar czf "pando-${VERSION}.${{ matrix.bottle_tag }}.bottle.tar.gz" "pando/${VERSION}/"
          if [[ "${{ matrix.runtime }}" == "true" ]]; then
            scripts/package-boxlite-sources "boxlite-runtime-sources-${VERSION}.tar.gz"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bottle-${{ matrix.bottle_tag }}
          path: |
            *.bottle.tar.gz
            boxlite-runtime-sources-*.tar.gz

  qualify-linux-runtime:
    needs: build
    environment: pando-runtime-qualification
    permissions:
      actions: read
      contents: read
    runs-on: [self-hosted, Linux, X64, pando-kvm-rootless]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bottle-x86_64_linux
      - name: Install pinned Rust harness toolchain
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
          rustup default "${RUST_TOOLCHAIN}"
      - name: Qualify exact Linux release artifact
        run: |
          set -euo pipefail
          test -r /dev/kvm && test -w /dev/kvm && test "$(id -u)" -ne 0
          version="${GITHUB_REF_NAME#v}"
          tar xzf "pando-${version}.x86_64_linux.bottle.tar.gz"
          scripts/test-boxlite-live "$PWD/pando/${version}/bin/pando"

  release:
    needs: [build, qualify-linux-runtime]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true
      - name: Generate changelog
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4 reviewed 2026-07-19
        id: changelog
        with:
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG.md
      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2 reviewed 2026-07-19
        with:
          body_path: CHANGELOG.md
          files: |
            *.bottle.tar.gz
            boxlite-runtime-sources-*.tar.gz

  update-tap:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true
      - name: Update homebrew formula
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=${GITHUB_REF_NAME#v}
          curl -fsSL "https://github.com/laulauland/pando/archive/refs/tags/v${VERSION}.tar.gz" -o /tmp/pando-source.tar.gz
          SOURCE_SHA=$(shasum -a 256 /tmp/pando-source.tar.gz | cut -d' ' -f1)
          ARM64_SHA=$(shasum -a 256 "pando-${VERSION}.arm64_sequoia.bottle.tar.gz" | cut -d' ' -f1)
          LINUX_SHA=$(shasum -a 256 "pando-${VERSION}.x86_64_linux.bottle.tar.gz" | cut -d' ' -f1)

          cat > /tmp/pando.rb << RUBY
          class Pando < Formula
            desc "Isolated copy-on-write workspaces with native jj integration"
            homepage "https://github.com/laulauland/pando"
            url "https://github.com/laulauland/pando/archive/refs/tags/v${VERSION}.tar.gz"
            sha256 "${SOURCE_SHA}"
            license "MIT"

            bottle do
              root_url "https://github.com/laulauland/pando/releases/download/v${VERSION}"
              sha256 arm64_sequoia: "${ARM64_SHA}"
              sha256 x86_64_linux: "${LINUX_SHA}"
            end

            on_linux do
              resource "boxlite-runtime" do
                url "https://github.com/boxlite-ai/boxlite/releases/download/v0.9.7/boxlite-runtime-v0.9.7-linux-x64-gnu.tar.gz", using: :nounzip
                sha256 "9ae495f55d363e6af04640ab55025ac80b4bf4762e38fa0b8ac80c7604e3148c"
              end
            end

            depends_on "rust" => :build

            def install
              args = std_cargo_args
              if OS.linux?
                ENV["BOXLITE_RUNTIME_URL"] = "file://#{resource("boxlite-runtime").cached_download}"
                args += ["--features", "microvm-boxlite"]
              end
              system "cargo", "install", *args
            end

            test do
              assert_match "pando", shell_output("#{bin}/pando --help")
              assert_match "pando", shell_output("#{bin}/pd --help")
              if OS.linux?
                assert_match "boxlite", shell_output("#{bin}/pando create --help")
              end
            end
          end
          RUBY

          # Remove leading whitespace from heredoc
          sed -i 's/^          //' /tmp/pando.rb

          EXISTING_SHA=$(gh api repos/laulauland/homebrew-tap/contents/Formula/pando.rb --jq '.sha')
          gh api repos/laulauland/homebrew-tap/contents/Formula/pando.rb \
            --method PUT \
            --field message="pando ${VERSION}" \
            --field content="$(base64 -w0 /tmp/pando.rb)" \
            --field sha="${EXISTING_SHA}"
