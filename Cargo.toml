[package]
name = "pando"
version = "0.2.6"
edition = "2021"

[[bin]]
name = "pd"
path = "src/bin/pd.rs"

[[bench]]
name = "create"
harness = false

[[bench]]
name = "compare"
harness = false

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
dirs = "5.0"
fs2 = "0.4"
jj-lib = "=0.40.0"
libc = "0.2"
pollster = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

[dev-dependencies]
proptest = "1.5"
tempfile = "3.10"
