[package]
name = "pando"
version = "0.3.1"
edition = "2021"

[features]
default = []
microvm-boxlite = ["dep:boxlite", "dep:tokio"]

[[bin]]
name = "pd"
path = "src/bin/pd.rs"

[[bench]]
name = "create"
harness = false

[[bench]]
name = "compare"
harness = false

[dependencies]
anyhow = "1.0"
boxlite = { version = "=0.9.7", optional = true }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
dirs = "5.0"
fs2 = "0.4"
jj-lib = "=0.40.0"
libc = "0.2"
pollster = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.10"
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
toml = "0.8"

[dev-dependencies]
proptest = "1.5"
